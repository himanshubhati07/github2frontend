<div class="space-y-6">
  <section class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center"><div><h2 class="text-3xl font-bold">Reports</h2><p class="mt-1 text-muted">Simple management summary for attendance and departments.</p></div><button type="button" (click)="exportSummary()" class="btn-primary">Export Report</button></section>
  @if (notice()) { <div class="rounded-2xl border border-green-200 bg-green-50 p-4 text-sm font-semibold text-success">{{ notice() }}</div> }
  <section class="grid gap-4 md:grid-cols-3"><div class="card p-5"><p class="text-sm text-muted">Present records</p><p class="mt-2 text-3xl font-bold text-success">{{ present() }}</p></div><div class="card p-5"><p class="text-sm text-muted">Late records</p><p class="mt-2 text-3xl font-bold text-warning">{{ late() }}</p></div><div class="card p-5"><p class="text-sm text-muted">Absent records</p><p class="mt-2 text-3xl font-bold text-danger">{{ absent() }}</p></div></section>
  <section class="card p-6"><div class="mb-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between"><h3 class="text-lg font-bold">Department report</h3><select class="input sm:max-w-xs" [ngModel]="department()" (ngModelChange)="department.set($event)"><option value="">All departments</option>@for (item of departments(); track item) { <option [value]="item">{{ item }}</option> }</select></div><div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">@for (employee of departmentEmployees(); track employee.id) { <button type="button" (click)="router.navigate(['/employees', employee.id])" class="rounded-3xl border border-line p-4 text-left transition hover:bg-muted-light"><p class="font-bold">{{ employee.name }}</p><p class="mt-1 text-sm text-muted">{{ employee.employeeId }} • {{ employee.department }}</p><p class="mt-3 text-xs font-semibold" [class.text-success]="employee.faceRegistered" [class.text-warning]="!employee.faceRegistered">Face {{ employee.faceRegistered ? 'registered' : 'pending' }}</p></button> }</div></section>
</div>
